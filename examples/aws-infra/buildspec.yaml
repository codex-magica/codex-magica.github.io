version: 0.2

# Builds the Vite app and publishes it to the private S3 bucket behind CloudFront.
# Env vars S3_BUCKET and CLOUDFRONT_DIST_ID are set on the CodeBuild project (pipeline.tf).
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm ci
  build:
    commands:
      - npm run build
      # The login page is part of this example, not the app: ship it at the site root.
      - cp examples/aws-infra/login.html dist/login.html
  post_build:
    commands:
      # Content-hashed assets never change under the same name: cache them for a year.
      - aws s3 sync dist/assets "s3://$S3_BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
      # Everything else (index.html, login.html, icons, manifest) must be revalidated on every visit.
      # Old hashed assets are kept, so a tab still running the previous build can lazy-load them.
      - aws s3 sync dist/ "s3://$S3_BUCKET" --exclude "assets/*" --cache-control "no-cache" --delete
      - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DIST_ID" --paths "/*"
