<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <!-- The browser/OS chrome and the launch screen use the app's page colour: dark by default, light if the
         player chose light (switched below and by the app). -->
    <meta name="theme-color" content="#13171f" />
    <!-- Paint the page in the right colour before the app's ~2 MB script has loaded, so a cold start in
         dark mode doesn't flash white. The mode comes from where Chakra keeps it; the colours are the
         app's `page` token (theme.ts) as hex, so even browsers without OKLCH show them. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("chakra-ui-color-mode") === "light" ? "light" : "dark"; // dark unless chosen otherwise
          document.documentElement.dataset.theme = m;
          document.documentElement.style.colorScheme = m;
          if (m === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#ebeff2");
        } catch (e) {}
      })();
    </script>
    <style>
      html, body, html[data-theme="dark"], html[data-theme="dark"] body { background-color: #13171f; }
      html[data-theme="light"], html[data-theme="light"] body { background-color: #ebeff2; }
    </style>
    <!-- Icon filenames carry the VITE_ICON_SUFFIX env var: empty in production, "-dev" in local
         development (see .env / .env.development) so the dev PWA/home-screen icon shows a DEV badge.
         ?v=N busts Safari's favicon cache, which is keyed by URL and ignores reloads: bump it whenever
         the icons change. -->
    <link rel="icon" href="/favicon%VITE_ICON_SUFFIX%.ico?v=4" sizes="48x48" />
    <link rel="icon" href="/favicon%VITE_ICON_SUFFIX%.svg?v=4" type="image/svg+xml" />
    <meta name="description" content="M.A.G.U.S. kompendium, karakteralkotó és karakterlap"/>

    <!-- PWA Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- the web app manifest link is injected by vite-plugin-pwa (see vite.config.ts) -->

    <!-- Android Specific Tags -->
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Apple Specific Tags -->
    <link rel="apple-touch-icon" href="/logo192%VITE_ICON_SUFFIX%.png?v=4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Codex Magica">

    <title>Codex Magica</title>
  </head>
  <body style="overflow: hidden; width: 100vw; height: 100vh">
    <noscript>Az alkalmazás futtatásához engedélyezd a JavaScriptet.</noscript>
    <!-- #root's size + desktop UI scaling live in index.css (the --app-zoom rules) -->
    <div id="status-tint" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
