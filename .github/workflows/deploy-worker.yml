name: Deploy token service

# The Cloudflare Worker in worker/ that renews Google Drive access for the app (see
# docs/google-drive-sync.md). Opt-in: set the repository variable DEPLOY_WORKER=true, the variable
# CLOUDFLARE_ACCOUNT_ID and the secret CLOUDFLARE_API_TOKEN. The Worker's own secrets (the Google client
# secret and the encryption key) are set once in Cloudflare and never pass through GitHub.
#
# Deploy order: the Worker must stay compatible with the app version players still have open, so a
# change to its API is added before the app starts using it, and removed only a release later.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_WORKER == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npx vitest run worker
      - run: npx tsc --noEmit -p worker
      - run: npm ci
        working-directory: worker
      - run: npx wrangler deploy --env=""
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
      - name: Check that it answers
        run: |
          url="${{ vars.TOKEN_SERVICE_URL }}"
          if [ -n "$url" ]; then
            sleep 5
            curl -fsS "$url/health" | tee /dev/stderr | grep -q '"configured":true'
          fi
