name: Deploy to GitHub Pages

# Opt-in: set the repository variable DEPLOY_PAGES=true (Settings → Secrets and variables →
# Actions → Variables) and choose Settings → Pages → Source: "GitHub Actions".
# The site is served at https://<owner>.github.io/<repo>/. For a custom domain or a
# <owner>.github.io repository, also set the variable BASE_PATH=/ .

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          # optional: the Google OAuth client ID for Drive sync (see docs/google-drive-sync.md)
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # the site's address, for link previews; set the variable SITE_URL for a custom domain
          VITE_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
