name: Deploy to GitHub Pages

# Opt-in: set the repository variable DEPLOY_PAGES=true (Settings → Secrets and variables →
# Actions → Variables) and choose Settings → Pages → Source: "GitHub Actions".
# The site is served at https://<owner>.github.io/<repo>/, or at https://<owner>.github.io/ when the
# repository is named <owner>.github.io. For a custom domain, also set the variables BASE_PATH=/ and SITE_URL.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || (github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name)) }}
          # optional: the Google OAuth client ID for Drive sync (see docs/google-drive-sync.md)
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # the site's address, for link previews; set the variable SITE_URL for a custom domain
          VITE_SITE_URL: ${{ vars.SITE_URL || (github.event.repository.name == format('{0}.github.io', github.repository_owner) && format('https://{0}.github.io/', github.repository_owner) || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name)) }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # only this job publishes, so only it gets the rights to (the build installs and runs dependencies)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
